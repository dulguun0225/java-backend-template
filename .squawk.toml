# squawk: PostgreSQL migration linter, run in CI over the migrations a change touches, gated on exit code
# (scripts/squawk-changed-migrations.mjs). The default rule set stays on: it carries the four hazards the
# java-backend-rules skill names (non-concurrent index build, table-rewriting type change, NOT NULL without a
# default, constraint added without NOT VALID). A migration that must do one of these opts out with
# `-- squawk-ignore-file <rule>` as its first line and a reason comment on the lines right after it; squawk
# 2.65 reads only the file-level form, so a statement-level `-- squawk-ignore` is silently ignored and would
# leave the rule firing.
pg_version = "18.0"

# Flyway runs each migration inside its own transaction.
assume_in_transaction = true

excluded_rules = [
  # Surrogate keys here are `uuid default uuidv7()`; identity columns are a sequence in disguise, which the
  # primary-keys skill bans. squawk's preference for identity is the opposite convention.
  "prefer-identity",
]
