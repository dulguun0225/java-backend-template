# mise.lock records every tool below at its exact version, with the download url and a checksum for each platform
# in `lockfile_platforms`: sha256, sha512 for Maven, and SHA-1 for the JDK, the only digest BellSoft publishes.
# `mise install` refuses a download whose checksum differs and, under `tool_config.locked`, a tool the lock lacks.
# backend/scripts/check-mise-lock.mjs fails the backend wall when the lock is out of date with this file or an
# entry lacks a checksum. After moving a pin here, run `mise lock` and commit both files.
[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64"]

[tool_config]
locked = true

[tools]
# Exact pins: two machines resolving a major differently is a toolchain behaviour change.
java = "liberica-25.0.4.1+1"
maven = "3.9.16"
# scripts/*.mjs run on this; Node rather than bash so the wall runs the same on Linux, macOS and Windows.
node = "24.21.0"
# The vulnerability scanner the wall runs (scripts/osv-scan.mjs); one pin for every platform instead of a per-OS download.
osv-scanner = "2.6.0"
# The OpenAPI ruleset linter the wall runs (scripts/vacuum-openapi.mjs). Registry entry checked 2026-09-16:
# mise's registry maps `vacuum` to `aqua:daveshanley/vacuum`, and `mise ls-remote vacuum` resolves it to 0.30.5.
vacuum = "0.30.5"
