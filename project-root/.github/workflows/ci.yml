# The project wall. `backend` runs the template's scripts/wall.mjs inside backend/; `frontend` runs the frontend
# gate. Both are required on main (.github/rulesets/main.json). Everything fails on its own exit code; nothing is
# advisory. Every action is pinned to a commit SHA (scripts/check-action-pins.mjs enforces it). The toolchain is
# whatever mise.toml pins, installed by mise here exactly as on a developer machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Actions are SHA-pinned
        run: node scripts/check-action-pins.mjs
      - name: Backend wall
        working-directory: backend
        run: node scripts/wall.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Required status checks match the committed job names
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-required-checks.mjs
      - name: Keep the verdict artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdicts
          path: |
            backend/target/classes/META-INF/sbom/application.cdx.json
            backend/target/osv-results.json
            backend/target/failsafe-reports/*.xml
            backend/target/surefire-reports/*.xml
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.7
          install_args: node
      - name: Frontend gate
        run: node scripts/frontend-gate.mjs
