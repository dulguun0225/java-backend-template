# The template's own wall: this repository *is* the backend, so the job runs scripts/wall.sh at the root. A
# project that vendors the template into backend/ runs the same script from project-root/.github/workflows/ci.yml
# with working-directory: backend. Every action is pinned to a commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Actions are SHA-pinned (template's own workflow and the project-root one it ships)
        run: project-root/scripts/check-action-pins.sh . && project-root/scripts/check-action-pins.sh project-root
      - name: Backend wall
        run: scripts/wall.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Keep the verdict artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verdicts
          path: |
            target/classes/META-INF/sbom/application.cdx.json
            target/osv-results.json
            target/failsafe-reports/*.xml
            target/surefire-reports/*.xml
          if-no-files-found: ignore
